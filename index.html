<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AnimeBro helps you discover anime and find official viewing links.">
  <title>AnimeBro — Discover anime</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="AnimeBro home">Anime<span>Bro</span></a>
      <p class="tagline">Your independent anime discovery guide.</p>
    </div>
    <form class="search-form" id="searchForm" role="search" novalidate>
      <label class="sr-only" for="searchBar">Search anime</label>
      <input id="searchBar" name="q" type="search" placeholder="Search anime by title…" autocomplete="off" maxlength="100">
      <button type="submit">Search</button>
    </form>
  </header>

  <main class="content">
    <div class="results-heading">
      <div><p class="eyebrow">DISCOVER</p><h1 id="resultsTitle">Popular anime</h1></div>
      <p id="resultsCount" aria-live="polite">Loading anime…</p>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <section id="animeGrid" class="anime-grid" aria-label="Anime results"></section>
  </main>

  <dialog id="detailsDialog" class="details-dialog" aria-labelledby="detailTitle">
    <button class="dialog-close" id="dialogClose" aria-label="Close details">×</button>
    <div id="detailsContent"></div>
  </dialog>

  <section class="help-section" aria-labelledby="helpTitle">
    <h2 id="helpTitle">Need help?</h2>
    <p>Suggestions or issues? <a href="mailto:maxsupersingod@gmail.com">Contact AnimeBro</a>.</p>
  </section>
  <footer>
    <p>Made with ❤️ by <strong>Giridhar.Mandalapu</strong></p>
    <p>© 2025 AnimeBro. Independent discovery project; not affiliated with Crunchyroll.</p>
  </footer>
  <script type="module" src="app.js?v=20260813-3"></script>
</body>
</html>
